name: Сборка и релиз MirrorCam

# Запускается при пуше тега вида v1.0.0, а также вручную из вкладки Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Установить зависимости npm
        run: npm install

      - name: Подготовить MSBuild (для softcam)
        uses: microsoft/setup-msbuild@v2

      - name: Клонировать softcam (MIT)
        run: git clone --depth 1 https://github.com/tshino/softcam.git softcam
        shell: pwsh

      - name: Сборка softcam.dll (x64)
        working-directory: softcam
        run: msbuild src\softcam\softcam.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Сборка softcam.dll (Win32 / x86)
        working-directory: softcam
        run: msbuild src\softcam\softcam.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Разложить softcam в src-tauri/vendor/softcam
        shell: pwsh
        run: |
          $vendor = "src-tauri/vendor/softcam"
          New-Item -ItemType Directory -Force "$vendor" | Out-Null
          $dlls = Get-ChildItem -Path softcam -Recurse -Filter softcam.dll
          if (-not $dlls) { throw "softcam.dll не найдена" }
          foreach ($d in $dlls) {
            if ($d.FullName -match '\\x64\\') { Copy-Item $d.FullName "$vendor/softcam-x64.dll" -Force }
            elseif ($d.FullName -match '\\Win32\\') { Copy-Item $d.FullName "$vendor/softcam-x86.dll" -Force }
          }
          if (-not (Test-Path "$vendor/softcam-x64.dll")) { throw "Нет softcam-x64.dll" }
          if (-not (Test-Path "$vendor/softcam-x86.dll")) { throw "Нет softcam-x86.dll" }
          Get-ChildItem "$vendor" | ForEach-Object { $_.Name + " " + $_.Length }

      - name: Определить тег релиза
        id: tagname
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ github.event.inputs.tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $t = "${{ github.ref }}".Replace("refs/tags/", "")
            "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Сборка и публикация релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tagname.outputs.tag }}
          releaseName: "MirrorCam ${{ steps.tagname.outputs.tag }}"
          releaseBody: |
            Установщик MirrorCam для Windows.

            Скачайте файл `MirrorCam_*_x64-setup.exe` ниже и запустите — приложение
            установится как обычная программа.
          releaseDraft: false
          prerelease: false
