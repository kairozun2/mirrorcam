name: Этап 0 — сборка фильтра виртуальной камеры (softcam)

# Изолированный шаг: проверяем, что DLL виртуальной камеры (softcam, MIT)
# собирается в облаке для x64 и x86. Не трогает релиз основного приложения.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-softcam:
    runs-on: windows-latest
    steps:
      - name: Клонировать softcam (MIT)
        run: git clone --depth 1 https://github.com/tshino/softcam.git softcam
        shell: pwsh

      - name: Подготовить MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Сборка softcam.dll (x64)
        working-directory: softcam
        run: msbuild src\softcam\softcam.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Сборка softcam.dll (Win32 / x86)
        working-directory: softcam
        run: msbuild src\softcam\softcam.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Собрать DLL по архитектурам
        working-directory: softcam
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../vcam-out | Out-Null
          $dlls = Get-ChildItem -Recurse -Filter softcam.dll
          $dlls | ForEach-Object { Write-Host $_.FullName }
          foreach ($d in $dlls) {
            if ($d.FullName -match '\\x64\\') { Copy-Item $d.FullName ../vcam-out/softcam-x64.dll -Force }
            elseif ($d.FullName -match '\\Win32\\') { Copy-Item $d.FullName ../vcam-out/softcam-x86.dll -Force }
          }
          Write-Host "=== Итоговые файлы ==="
          Get-ChildItem ../vcam-out | ForEach-Object { $_.Name + " " + $_.Length }

      - name: Выгрузить DLL как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: softcam-dll
          path: vcam-out/*.dll
          if-no-files-found: error
